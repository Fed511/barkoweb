<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="BARKO is a strange little adventure about a dog searching for his human."
    >

    <title>BARKO - Official Website</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/tabImg.png">
</head>

<body>

    <!-- Personaggio in alto a sinistra -->
    <img
        class="corner-character human-image"
        src="assets/humanMenu.png"
        alt="The human"
    >

    <main class="page-container">

   <section class="hero">

    <div class="title-row">

        <img
            class="title-dog"
            src="assets/dogMenu.png"
            alt="BARKO, the dog protagonist"
        >

        <img
            class="title-image"
            src="assets/titleMenu.png"
            alt="BARKO"
        >

    </div>

    <p class="game-description">
        A strange little adventure about a dog searching for his human.
    </p>

</section>

        <nav
            class="links-container"
            aria-label="Official BARKO links"
        >

            <a
                class="link-button steam-button"
                href="https://store.steampowered.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Steam
            </a>

            <a
                class="link-button spotify-button"
                href="https://open.spotify.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Spotify
            </a>

            <a
                class="link-button youtube-button"
                href="https://www.youtube.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                YouTube
            </a>

            <a
                class="link-button instagram-button"
                href="https://www.instagram.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Instagram
            </a>

            <a
                class="link-button itch-button"
                href="https://itch.io/"
                target="_blank"
                rel="noopener noreferrer"
            >
                itch.io
            </a>

        </nav>

    </main>

    <footer class="footer">
        <p>© 2026 BARKO. All rights reserved.</p>
    </footer>

</body>
</html>
